<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick slips · Ink Kulture</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: #e9ebef; }
    .toolbar-print { position: sticky; top: 0; background: #111318; color: #fff; padding: 12px 20px; display: flex; gap: 12px; align-items: center; z-index: 5; }
    .toolbar-print .btn { background: #fff; }
    .sheets { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .slip { background: #fff; width: 148mm; min-height: 105mm; padding: 8mm; box-shadow: var(--shadow); color: #000; font-size: 12pt; }
    .slip .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; }
    .slip .brand { font-size: 9pt; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .slip .ordername { font-size: 30pt; font-weight: 900; line-height: 1; margin-top: 2mm; }
    .slip .date { font-size: 9pt; color: #444; margin-top: 1mm; }
    .slip svg.bc { width: 70mm; height: 24mm; }
    .slip .bctext { text-align: center; font-family: var(--mono); font-size: 10pt; font-weight: 700; }
    .slip table { width: 100%; border-collapse: collapse; margin-top: 5mm; font-size: 11pt; }
    .slip th { text-align: left; font-size: 8pt; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1.5pt solid #000; padding: 1.5mm 1mm; }
    .slip td { border-bottom: .5pt solid #bbb; padding: 1.5mm 1mm; vertical-align: middle; }
    .slip td img { width: 14mm; height: 14mm; object-fit: contain; }
    .slip .qty { font-size: 16pt; font-weight: 900; text-align: center; }
    .slip .box { width: 6mm; height: 6mm; border: 1.2pt solid #000; display: inline-block; }
    .slip .foot { margin-top: 4mm; display: flex; justify-content: space-between; font-size: 10pt; font-weight: 700; }
    .slip.cancelled { outline: 4pt solid #c00; }
    @media print {
      @page { size: A6 landscape; margin: 0; }
      body { background: #fff; }
      .toolbar-print { display: none; }
      .sheets { padding: 0; gap: 0; }
      .slip { box-shadow: none; width: 148mm; height: 105mm; overflow: hidden; page-break-after: always; break-after: page; }
    }
  </style>
</head>
<body>
  <div class="toolbar-print">
    <strong>Pick slips</strong><span id="info" style="opacity:.8"></span>
    <div style="flex:1"></div>
    <label style="display:flex;gap:6px;align-items:center;font-size:15px">Paper
      <select id="paper" style="min-height:36px;border-radius:8px"><option value="A6 landscape">A6 landscape</option><option value="A5 landscape">A5 landscape</option><option value="A4 portrait">A4</option></select></label>
    <button class="btn small" onclick="window.print()">Print</button>
  </div>
  <div class="sheets" id="sheets"><div class="empty">Loading…</div></div>
  <script src="/vendor/JsBarcode.all.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (async function () {
      const { esc, api } = IK;
      const p = new URLSearchParams(location.search);
      const pageStyle = document.createElement('style');
      document.head.appendChild(pageStyle);
      const setPaper = (v) => { pageStyle.textContent = `@media print { @page { size: ${v}; margin: 0; } }`; };
      document.getElementById('paper').addEventListener('change', (e) => setPaper(e.target.value));

      let targets = [];
      try {
        if (p.get('all')) {
          const q = await api('GET', '/api/print/queue');
          targets = q.orders.map((o) => ({ id: o.id }));
        } else if (p.get('id')) targets = [{ id: p.get('id') }];
        else if (p.get('code')) targets = [{ code: p.get('code') }];
      } catch (e) {
        document.getElementById('sheets').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        return;
      }
      if (!targets.length) { document.getElementById('sheets').innerHTML = '<div class="empty">No orders awaiting pick.</div>'; return; }
      const slips = [];
      for (const t of targets) {
        try {
          const r = await api('GET', `/api/print/order?${t.id ? `id=${encodeURIComponent(t.id)}` : `code=${encodeURIComponent(t.code)}`}`);
          slips.push(r.order);
        } catch (e) { slips.push({ error: e.message, name: t.id || t.code }); }
      }
      document.getElementById('info').textContent = `${slips.length} slip${slips.length === 1 ? '' : 's'}`;
      document.getElementById('sheets').innerHTML = slips.map((o, idx) => o.error ? `<div class="slip"><b>${esc(o.name)}</b>: ${esc(o.error)}</div>` : `
        <section class="slip ${o.cancelled ? 'cancelled' : ''}">
          <div class="top">
            <div>
              <div class="brand">Ink Kulture · Pick slip</div>
              <div class="ordername">${esc(o.name)}</div>
              <div class="date">${esc(IK.fmtTime(o.createdAt))}${o.cancelled ? ' · <b style="color:#c00">CANCELLED — DO NOT PACK</b>' : ''}</div>
            </div>
            <div><svg class="bc" id="bc${idx}"></svg><div class="bctext">${esc(o.barcode)}</div></div>
          </div>
          <table>
            <thead><tr><th></th><th>Design</th><th>SKU</th><th style="text-align:center">Qty</th><th>✓</th></tr></thead>
            <tbody>${o.items.map((i) => `<tr>
              <td>${i.imageUrl ? `<img src="${esc(i.imageUrl)}${i.imageUrl.includes('?') ? '&' : '?'}width=200" alt="" onerror="this.remove()">` : ''}</td>
              <td><b>${esc(i.title)}</b>${i.variantTitle ? `<br><span style="font-size:9pt">${esc(i.variantTitle)}</span>` : ''}</td>
              <td style="font-family:var(--mono)">${esc(i.sku || '')}</td>
              <td class="qty">${i.qty}</td><td><span class="box"></span></td></tr>`).join('')}</tbody>
          </table>
          <div class="foot"><span>${o.items.length} design${o.items.length === 1 ? '' : 's'} · ${o.totalQty} item${o.totalQty === 1 ? '' : 's'}</span><span>Scan slip → scan items → scan slip again</span></div>
        </section>`).join('');
      slips.forEach((o, idx) => {
        if (o.error) return;
        JsBarcode(`#bc${idx}`, o.barcode, { format: 'CODE128', displayValue: false, margin: 0, height: 80, width: 2.4 });
      });
      if (p.get('autoprint')) setTimeout(() => window.print(), 400);
    })();
  </script>
</body>
</html>
