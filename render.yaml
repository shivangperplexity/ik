# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: ik-pickpack
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ik-pickpack-db
          property: connectionString
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: APP_TIMEZONE
        value: Asia/Kolkata
databases:
  - name: ik-pickpack-db
    plan: basic-256mb
    region: singapore
